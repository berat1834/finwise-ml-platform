version: '3.8'

services:
  # PostgreSQL Database - Production-like environment
  postgres:
    image: postgres:15-alpine
    container_name: finwise-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: finwise_production
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finwise_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin - Database Management UI (Opsiyonel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finwise-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finwise.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    name: finwise_postgres_data
  pgadmin_data:
    name: finwise_pgadmin_data

networks:
  default:
    name: finwise_network
