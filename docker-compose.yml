version: "3.9"
services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finwise-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - api

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: credit-risk-api
    command: ["waitress-serve", "--host=0.0.0.0", "--port=5000", "--call", "app_v2_secure:create_app"]
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app_v2_secure.py
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - MODEL_PATH=/app/production_model.joblib
      - MODEL_META_PATH=/app/production_model_meta.json
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: credit-risk-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=credit_risk_db
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

