apiVersion: v1
kind: Secret
metadata:
  name: credit-risk-secrets
  namespace: credit-risk-system
type: Opaque
data:
  # Replace with base64 encoded secure values in production
  # e.g., echo -n "your_secure_value" | base64
  # The values must be base64 encoded when creating the secret
  SECRET_KEY: # REPLACE_ME
  JWT_SECRET_KEY: # REPLACE_ME
  POSTGRES_PASSWORD: # REPLACE_ME
  GRAFANA_PASSWORD: # REPLACE_ME
