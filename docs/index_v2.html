<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinWise | Akıllı Kredi Risk Analizi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        :root {
            --app-bg: #f3f7f7;
            --app-bg-soft: #eef6f7;
            --panel-border: #dce7e9;
            --panel-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
        }
        body {
            background:
                radial-gradient(circle at 10% -5%, #d9f3ef 0%, rgba(217, 243, 239, 0) 42%),
                radial-gradient(circle at 98% 10%, #e5f0ff 0%, rgba(229, 240, 255, 0) 36%),
                linear-gradient(180deg, var(--app-bg-soft) 0%, var(--app-bg) 56%, #f7fafb 100%);
        }
        nav {
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.88);
            position: sticky;
            top: 0;
        }
        main {
            background: transparent !important;
        }
        main::before {
            content: '';
            position: fixed;
            inset: 64px 0 0 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(15, 23, 42, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 23, 42, 0.03) 1px, transparent 1px);
            background-size: 38px 38px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.16), transparent 75%);
            z-index: 0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.36);
            box-shadow: 0 24px 64px rgba(15, 23, 42, 0.26);
        }
        .surface-card {
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            background: linear-gradient(180deg, #ffffff 0%, #fcfefe 100%);
        }
        .app-shell input[type="text"],
        .app-shell input[type="number"],
        .app-shell input[type="password"],
        .app-shell select {
            border-radius: 10px;
            border-color: #d5e0e3;
            background-color: #f7fbfc;
            transition: all .2s ease;
        }
        .app-shell input[type="text"]:focus,
        .app-shell input[type="number"]:focus,
        .app-shell input[type="password"]:focus,
        .app-shell select:focus {
            background-color: #ffffff;
            border-color: #14b8a6;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
        }
        .app-shell button {
            transition: all .2s ease;
        }
        @keyframes panelEnter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .app-shell > .grid > div > .bg-white,
        #shap-section,
        #improvementSuggestionsContainer > div {
            animation: panelEnter .42s ease both;
        }
        .metrics-number {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.01em;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #0f766e 0%, #1e293b 100%);
        }
    </style>
</head>
<body class="font-sans text-gray-800 h-screen overflow-hidden flex flex-col" x-data="appData()">

    <!-- Navbar -->
    <nav class="border-b border-gray-200/80 h-16 flex items-center justify-between px-6 shadow-sm z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">F</div>
            <span class="text-xl font-bold text-gray-800 tracking-tight">FinWise<span class="text-brand-600">ML</span></span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center rounded-lg border border-gray-200 overflow-hidden text-xs font-bold">
                <button @click="currency = 'TRY'" :class="currency === 'TRY' ? 'bg-brand-600 text-white' : 'bg-white text-gray-500 hover:bg-gray-50'" class="px-2.5 py-1.5 transition">₺ TRY</button>
                <button @click="currency = 'USD'" :class="currency === 'USD' ? 'bg-brand-600 text-white' : 'bg-white text-gray-500 hover:bg-gray-50'" class="px-2.5 py-1.5 transition">$ USD</button>
            </div>
            <button @click="lang = lang === 'tr' ? 'en' : 'tr'" class="text-sm font-semibold text-gray-500 hover:text-brand-600 transition uppercase" x-text="lang === 'tr' ? 'EN' : 'TR'" title="Dili Değiştir / Switch Language"></button>
        </div>
        <div class="flex items-center gap-4" x-show="isLoggedIn" x-cloak>
            <span class="text-sm text-gray-600"><span x-text="lang === 'tr' ? 'Hoşgeldin,' : 'Welcome,'"></span> <span class="font-semibold" x-text="username"></span></span>
            <button @click="confirmLogout" class="text-sm text-red-600 hover:text-red-700 font-medium transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> <span x-text="lang === 'tr' ? 'Çıkış' : 'Logout'"></span>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-auto relative bg-gray-50">
        
        <!-- LOGIN SCREEN -->
        <div x-show="!isLoggedIn" x-transition.opacity class="absolute inset-0 z-50 flex items-center justify-center gradient-bg">
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md glass-panel">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2" x-text="lang === 'tr' ? 'Giriş Yap' : 'Sign In'"></h2>
                    <p class="text-gray-500" x-text="lang === 'tr' ? 'FinWise Kredi Risk Analiz Sistemi' : 'FinWise Credit Risk Analysis System'"></p>
                </div>
                <form @submit.prevent="login">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1" x-text="lang === 'tr' ? 'Kullanıcı Adı' : 'Username'"></label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3 top-3.5 text-gray-400"></i>
                            <input type="text" x-model="loginForm.username" class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition" placeholder="admin">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1" x-text="lang === 'tr' ? 'Şifre' : 'Password'"></label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-3.5 text-gray-400"></i>
                            <input type="password" x-model="loginForm.password" class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition" placeholder="••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-lg shadow-lg transform hover:-translate-y-0.5 transition duration-200">
                        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> <span x-text="lang === 'tr' ? 'Sisteme Gir' : 'Sign In'"></span>
                    </button>
                    <p class="text-xs text-center text-gray-400 mt-4" x-text="lang === 'tr' ? 'Varsayılan: admin / admin123' : 'Default: admin / admin123'"></p>
                </form>
            </div>
        </div>

        <!-- APPLICATION DASHBOARD -->
        <div x-show="isLoggedIn" class="app-shell container mx-auto max-w-7xl p-4 md:p-6 relative z-10" x-cloak>
            
            <!-- Header -->
            <div class="mb-4 rounded-xl border border-slate-200/80 bg-white/85 backdrop-blur px-4 py-3 shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-2 text-[11px]">
                    <span class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200 bg-emerald-50 text-emerald-700 px-2.5 py-1 font-semibold">
                        <i class="fa-solid fa-circle text-[8px]"></i>
                        <span x-text="lang === 'tr' ? 'Canli Analiz' : 'Live Analysis'"></span>
                    </span>
                    <span class="inline-flex items-center gap-1.5 rounded-full border border-sky-200 bg-sky-50 text-sky-700 px-2.5 py-1 font-semibold">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span x-text="lang === 'tr' ? 'Guvenli Islem Akisi' : 'Secure Workflow'"></span>
                    </span>
                    <span class="inline-flex items-center gap-1.5 rounded-full border border-violet-200 bg-violet-50 text-violet-700 px-2.5 py-1 font-semibold">
                        <i class="fa-solid fa-code-branch"></i>
                        <span>v2.6</span>
                    </span>
                </div>
                <p class="text-[11px] text-gray-500" x-text="lang === 'tr' ? 'Kurumsal kredi karar destek paneli' : 'Enterprise credit decision support panel'"></p>
            </div>

            <div class="mb-6 flex flex-col gap-3 md:flex-row md:justify-between md:items-end">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800" x-text="lang === 'tr' ? 'Kredi Başvurusu' : 'Credit Application'"></h1>
                    <p class="text-gray-500" x-text="lang === 'tr' ? 'Müşteri verilerini girerek anında risk analizi yapın.' : 'Analyze credit risk instantly with customer data.'"></p>
                </div>
                <div class="text-right flex flex-wrap gap-2">
                    <button @click="openApplicationHistory" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-brand-600 shadow-sm px-4 py-2 rounded-lg text-sm font-medium transition"><i class="fa-solid fa-clock-rotate-left mr-1"></i> <span x-text="lang === 'tr' ? 'Başvuru Geçmişi' : 'Application History'"></span></button>
                    <button @click="resetForm" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-brand-600 shadow-sm px-4 py-2 rounded-lg text-sm font-medium transition"><i class="fa-solid fa-plus mr-1"></i> <span x-text="lang === 'tr' ? 'Yeni Başvuru' : 'New Application'"></span></button>
                </div>
            </div>

            <div x-show="showSessionWarning" class="mb-6 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 flex flex-wrap items-center justify-between gap-3" x-cloak>
                <div class="text-sm text-amber-900">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                    <span x-text="lang === 'tr' ? 'Oturumunuz yakında kapanacak.' : 'Your session is about to expire.'"></span>
                    <strong class="ml-1" x-text="`${sessionCountdownSeconds}s`"></strong>
                </div>
                <button @click="staySignedIn" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                    <span x-text="lang === 'tr' ? 'Oturumu Sürdür' : 'Stay Signed In'"></span>
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                <!-- Left Column: Form -->
                <div class="lg:col-span-8 space-y-6">
                    <div class="surface-card p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-user-tag mr-2 text-brand-500"></i><span x-text="lang === 'tr' ? 'Kişisel & Finansal Bilgiler' : 'Personal & Financial Information'"></span></h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Müşteri ID / Ad' : 'Customer ID / Name'"></label>
                                <input type="text" x-model="form.customer_id" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Yaş' : 'Age'"></label>
                                <input type="number" x-model="form.person_age" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? `Yıllık Gelir (${currency})` : `Annual Income (${currency})`"></label>
                                <input type="number" x-model="form.person_income" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Çalışma Süresi (Yıl)' : 'Employment Length (Years)'"></label>
                                <input type="number" x-model="form.person_emp_length" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Ev Sahipliği' : 'Home Ownership'"></label>
                                <select x-model="form.person_home_ownership" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                                    <option value="RENT" x-text="lang === 'tr' ? 'KİRACI (RENT)' : 'TENANT (RENT)'"></option>
                                    <option value="OWN" x-text="lang === 'tr' ? 'EV SAHİBİ (OWN)' : 'HOMEOWNER (OWN)'"></option>
                                    <option value="MORTGAGE" x-text="lang === 'tr' ? 'İPOTEKLİ (MORTGAGE)' : 'MORTGAGE (MORTGAGE)'"></option>
                                    <option value="OTHER" x-text="lang === 'tr' ? 'DİĞER' : 'OTHER'"></option>
                                </select>
                            </div>
                        </div>

                        <h3 class="text-lg font-semibold text-gray-800 mt-8 mb-4 border-b pb-2"><i class="fa-solid fa-money-bill-transfer mr-2 text-brand-500"></i><span x-text="lang === 'tr' ? 'Kredi Detayları' : 'Loan Details'"></span></h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? `Kredi Tutarı (${currency})` : `Loan Amount (${currency})`"></label>
                                <input type="number" x-model="form.loan_amnt" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Faiz Oranı (%)' : 'Interest Rate (%)'"></label>
                                <input type="number" step="0.1" x-model="form.loan_int_rate" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Kredi Amacı' : 'Loan Purpose'"></label>
                                <select x-model="form.loan_intent" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                                    <option value="PERSONAL" x-text="lang === 'tr' ? 'KİŞİSEL' : 'PERSONAL'"></option>
                                    <option value="EDUCATION" x-text="lang === 'tr' ? 'EĞİTİM' : 'EDUCATION'"></option>
                                    <option value="MEDICAL" x-text="lang === 'tr' ? 'SAĞLIK' : 'MEDICAL'"></option>
                                    <option value="VENTURE" x-text="lang === 'tr' ? 'GİRİŞİM' : 'VENTURE'"></option>
                                    <option value="HOMEIMPROVEMENT" x-text="lang === 'tr' ? 'EV TADİLAT' : 'HOME IMPROVEMENT'"></option>
                                    <option value="DEBTCONSOLIDATION" x-text="lang === 'tr' ? 'BORÇ BİRLEŞTİRME' : 'DEBT CONSOLIDATION'"></option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Kredi Geçmişi (Yıl)' : 'Credit History (Years)'"></label>
                                <input type="number" x-model="form.cb_person_cred_hist_length" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Geçmiş Temerrüt?' : 'Past Default?'"></label>
                                <select x-model="form.cb_person_default_on_file" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                                    <option value="N" x-text="lang === 'tr' ? 'HAYIR' : 'NO'"></option>
                                    <option value="Y" x-text="lang === 'tr' ? 'EVET' : 'YES'"></option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1" x-text="lang === 'tr' ? 'Kredi Notu (Grade)' : 'Credit Grade'"></label>
                                <select x-model="form.loan_grade" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 transition">
                                    <option value="A" x-text="lang === 'tr' ? 'A (Mükemmel)' : 'A (Excellent)'"></option>
                                    <option value="B" x-text="lang === 'tr' ? 'B (Çok İyi)' : 'B (Very Good)'"></option>
                                    <option value="C" x-text="lang === 'tr' ? 'C (İyi)' : 'C (Good)'"></option>
                                    <option value="D" x-text="lang === 'tr' ? 'D (Orta)' : 'D (Average)'"></option>
                                    <option value="E" x-text="lang === 'tr' ? 'E (Riskli)' : 'E (Risky)'"></option>
                                    <option value="F" x-text="lang === 'tr' ? 'F (Çok Riskli)' : 'F (Very Risky)'"></option>
                                    <option value="G" x-text="lang === 'tr' ? 'G (Kötü)' : 'G (Poor)'"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-8 space-y-2">
                            <button @click="analyzeRisk" :disabled="loading" class="w-full bg-brand-600 hover:bg-brand-700 disabled:bg-gray-400 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition-all flex justify-center items-center gap-2">
                                <span x-show="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> <span x-text="lang === 'tr' ? 'Analiz Ediliyor...' : 'Analyzing...'"></span></span>
                                <span x-show="!loading"><i class="fa-solid fa-wand-magic-sparkles"></i> <span x-text="lang === 'tr' ? 'RİSK ANALİZİ BAŞLAT' : 'START RISK ANALYSIS'"></span></span>
                            </button>
                            <p class="text-[11px] text-gray-500 text-center" x-text="msg('shortcut_hint')"></p>
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                                <button @click="autoFillDemo" class="w-full bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-medium py-2 rounded-lg transition text-sm">
                                    <i class="fa-solid fa-bolt mr-1"></i> <span x-text="lang === 'tr' ? 'Akıllı Otomatik Doldur' : 'Smart Auto Fill'"></span>
                                </button>
                                <button @click="generateAutoFillBatch" class="w-full bg-teal-100 hover:bg-teal-200 text-teal-700 font-medium py-2 rounded-lg transition text-sm">
                                    <i class="fa-solid fa-layer-group mr-1"></i> <span x-text="lang === 'tr' ? '5 Senaryo Üret' : 'Generate 5 Scenarios'"></span>
                                </button>
                                <button @click="clearDraft" class="w-full bg-rose-100 hover:bg-rose-200 text-rose-700 font-medium py-2 rounded-lg transition text-sm">
                                    <i class="fa-solid fa-eraser mr-1"></i> <span x-text="lang === 'tr' ? 'Taslağı Temizle' : 'Clear Draft'"></span>
                                </button>
                                <button @click="restoreDraft" class="w-full bg-sky-100 hover:bg-sky-200 text-sky-700 font-medium py-2 rounded-lg transition text-sm">
                                    <i class="fa-solid fa-rotate-left mr-1"></i> <span x-text="lang === 'tr' ? 'Taslağı Geri Yükle' : 'Restore Draft'"></span>
                                </button>
                            </div>
                            <div class="flex flex-col md:flex-row md:items-center gap-2 text-xs">
                                <div class="flex items-center gap-2">
                                    <span class="text-gray-500" x-text="lang === 'tr' ? 'Profil Modu:' : 'Profile Mode:'"></span>
                                    <select x-model="autoFillMode" class="px-2 py-1 rounded-md border border-gray-200 bg-white text-gray-700">
                                        <option value="random" x-text="lang === 'tr' ? 'Rastgele (Ağırlıklı)' : 'Random (Weighted)'"></option>
                                        <option value="low" x-text="lang === 'tr' ? 'Düşük Risk' : 'Low Risk'"></option>
                                        <option value="mid" x-text="lang === 'tr' ? 'Orta Risk' : 'Medium Risk'"></option>
                                        <option value="high" x-text="lang === 'tr' ? 'Yüksek Risk' : 'High Risk'"></option>
                                    </select>
                                </div>
                                <button @click="showAutoProfileGuide = !showAutoProfileGuide" class="self-start md:self-auto px-2 py-1 rounded-md border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                                    <i class="fa-solid fa-circle-info mr-1"></i>
                                    <span x-text="lang === 'tr' ? 'Profil aralıkları' : 'Profile ranges'"></span>
                                </button>
                            </div>
                            <p class="text-xs text-gray-500 flex items-center gap-2" x-show="lastAutoFillProfile" x-cloak>
                                <span x-text="lang === 'tr' ? 'Son otomatik profil:' : 'Last auto profile:'"></span>
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full border text-[11px] font-semibold"
                                      :class="getAutoProfileBadgeClass()"
                                      x-text="getAutoProfileLabel()"></span>
                            </p>
                            <div class="text-xs rounded-lg border border-gray-200 bg-gray-50 p-2 text-gray-600" x-show="showAutoProfileGuide" x-cloak>
                                <p class="font-semibold mb-1" x-text="lang === 'tr' ? 'Profil üretim rehberi' : 'Profile generation guide'"></p>

    <script>
        function appData() {
            return {
                isLoggedIn: false,
                lang: 'tr',
                showDetails: false,
                currency: 'TRY',
                role: localStorage.getItem('user_role') || '',
                token: localStorage.getItem('token') || '',
                username: localStorage.getItem('username') || '',
                loading: false,
                result: null,
                loginForm: { username: '', password: '' },
                form: {
                    customer_id: 'CUST-' + Math.floor(Math.random() * 10000),
                    person_age: 30,
                    person_income: 60000,
                    person_emp_length: 5,
                    loan_amnt: 20000,
                    loan_int_rate: 11.5,
                    loan_percent_income: 0.33,
                    cb_person_cred_hist_length: 4,
                    person_home_ownership: 'RENT',
                    loan_intent: 'PERSONAL',
                    loan_grade: 'C',
                    cb_person_default_on_file: 'N'
                },
                chatInput: '',
                chatMessages: [],
                shapChartInstance: null,
                inactivityTimeoutMs: 10 * 60 * 1000,
                inactivityByRole: {
                    admin: 5 * 60 * 1000,
                    manager: 10 * 60 * 1000,
                    analyst: 15 * 60 * 1000,
                },
                inactivityTimer: null,
                warningTimer: null,
                countdownInterval: null,
                sessionWarningMs: 60 * 1000,
                showSessionWarning: false,
                sessionCountdownSeconds: 0,
                activityHandlerBound: false,
                historyMeta: {},
                draftStatusText: '',
                lastAutoFillSignature: '',
                recentAutoFillSignatures: [],
                lastAutoFillProfile: '',
                autoFillMode: 'random',
                showAutoProfileGuide: false,
                autoFillPrefsKey: 'finwise_auto_fill_prefs_v1',
                autoFillBatch: [],
                autoFillBatchKey: 'finwise_auto_fill_batch_v1',
                lastExportInfo: '',
                lastAnalysisAt: '',

                init() {
                    if (this.token) {
                        this.isLoggedIn = true;
                    }
                    this.role = localStorage.getItem('user_role') || '';
                    this.loadHistoryMeta();
                    this.loadDraft(false);
                    this.loadAutoFillPreferences();
                    this.loadAutoFillBatch();
                    this.$watch('form', () => this.saveDraft());
                    this.$watch('currency', () => this.saveDraft());
                    this.$watch('autoFillMode', () => this.saveAutoFillPreferences());
                    this.$watch('showAutoProfileGuide', () => this.saveAutoFillPreferences());
                    this.inactivityTimeoutMs = this.resolveInactivityTimeoutMs();
                    this.setupInactivityWatcher();
                    this.setupKeyboardShortcuts();
                },

                setupKeyboardShortcuts() {
                    window.addEventListener('keydown', (event) => {
                        if (!this.isLoggedIn) return;
                        const isInputTarget = ['INPUT', 'TEXTAREA', 'SELECT'].includes(String(event.target?.tagName || '').toUpperCase());
                        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                            event.preventDefault();
                            if (!this.loading) this.analyzeRisk();
                        }
                        if (event.key === 'Escape') {
                            if (this.showDetails) this.showDetails = false;
                        }
                        if ((event.altKey && event.key.toLowerCase() === 'h') && !isInputTarget) {
                            event.preventDefault();
                            this.openApplicationHistory();
                        }
                    });
                },

                    const dict = {
                        tr: {
                            draft_restored: 'Kaydedilmis taslak geri yuklendi.',
                            draft_not_found: 'Kayitli taslak bulunamadi.',

                            server_error: 'Sunucu hatasi.',
                            export_need_result: 'Once bir analiz sonucu uretin.',
                            export_pdf_open_failed: 'PDF gorunumu acilamadi.',
                            export_success: 'Disa aktarma basarili.',
                            export_last_prefix: 'Son disa aktarma: ',
                            analysis_failed: 'Analiz sirasinda hata olustu.',
                            loading_history: 'Gecmis yukleniyor...',
                            generic_error: 'Hata',
                            bulk_delete_confirm: '{count} kayit silinsin mi?',
                            delete_action: 'Sil',
                            cancel_action: 'Vazgec',

                            selected_records_deleted: 'Secili kayitlar silindi.',
                            bulk_delete_failed: 'Toplu silme basarisiz.',
                            record_loaded_form: 'Kayit forma aktarildi.',
                            delete_record_confirm: '#{id} kaydi silinsin mi?',
                            record_deleted: '#{id} kaydi silindi.',
                            delete_failed: 'Silme basarisiz.',
                            saved_action: 'Kaydedildi',
                            save_action: 'Kaydet',
                            note_tags_saved: 'Not ve etiket kaydedildi.',
                            clear_history_confirm: 'Tum gecmis kayitlari silinsin mi?',
                            delete_all_action: 'Tumunu sil',
                            all_history_deleted: 'Tum gecmis kayitlari silindi.',
                            clear_failed: 'Temizleme basarisiz.',
                            history_error: 'Gecmis hatasi',
                            improvement_load_failed: 'Iyilestirme onerileri yuklenemedi.',
                            default_scenario_title: 'Senaryo'
                            ,draft_cleared: 'Taslak temizlendi.'
                            ,logout_confirm: 'Cikis yapmak istediginize emin misiniz?'
                            ,logout_confirm_yes: 'Evet, cikis yap'
                            ,risk_low: 'Dusuk Risk'
                            ,risk_medium: 'Orta Risk'
                            ,risk_high: 'Yuksek Risk'

                            ,profile_medium: 'Orta'
                            ,profile_high: 'Yuksek'
                            ,batch_generated: '{count} senaryo uretildi. Uygulamak icin listeden secin.'
                            ,scenario_applied: '{index}. senaryo forma uygulandi.'
                            ,scenario_list_cleared: 'Senaryo listesi temizlendi.'
                            ,offers_title: 'Banka Teklifleri'
                            ,offers_loading: 'Teklifler yukleniyor...'
                            ,offer_error: 'Teklif hatasi'
                            ,offers_empty: 'Uygun teklif bulunamadi.'
                            ,offers_label: 'Teklifler'
                            ,sort_label: 'Sirala'
                            ,sort_monthly_asc: 'Aylik Taksit (Dusuk-Yuksek)'
                            ,sort_apr_asc: 'Faiz (Dusuk-Yuksek)'

                loadAutoFillPreferences() {
                    try {
                        const raw = localStorage.getItem(this.autoFillPrefsKey);
                        if (!raw) return;
                        const parsed = JSON.parse(raw) || {};
                        if (['random', 'low', 'mid', 'high'].includes(parsed.autoFillMode)) {
                            this.autoFillMode = parsed.autoFillMode;
                        }
                        if (typeof parsed.showAutoProfileGuide === 'boolean') {
                            this.showAutoProfileGuide = parsed.showAutoProfileGuide;
                        }
                    } catch (e) {
                        console.warn('Could not load auto-fill preferences:', e);
                    }
                },

                saveAutoFillPreferences() {
                    try {
                        const payload = {
                            autoFillMode: this.autoFillMode,
                            showAutoProfileGuide: this.showAutoProfileGuide,
                        };
                        localStorage.setItem(this.autoFillPrefsKey, JSON.stringify(payload));
                    } catch (e) {
                        console.warn('Could not save auto-fill preferences:', e);
                    }
                },

                loadAutoFillBatch() {
                    try {
                        const raw = localStorage.getItem(this.autoFillBatchKey);
                        if (!raw) return;
                        const parsed = JSON.parse(raw);
                        if (!Array.isArray(parsed)) return;
                        this.autoFillBatch = parsed
                            .filter(x => x && x.form && typeof x.form === 'object')
                            .slice(0, 20);
                    } catch (e) {
                        console.warn('Could not load auto-fill batch:', e);
                    }
                },

                saveAutoFillBatch() {
                    try {
                        localStorage.setItem(this.autoFillBatchKey, JSON.stringify(this.autoFillBatch || []));
                    } catch (e) {
                        console.warn('Could not save auto-fill batch:', e);
                    }

                saveDraft() {
                    try {
                        const payload = {
                            form: this.form,
                            currency: this.currency,
                            saved_at: new Date().toISOString(),
                        };
                        localStorage.setItem('finwise_draft_v1', JSON.stringify(payload));
                        const locale = this.getLocale();
                        this.draftStatusText = this.msg('draft_autosaved', {
                            time: new Date(payload.saved_at).toLocaleTimeString(locale)
                        });
                    } catch (e) {
                        console.warn('Could not save draft:', e);
                    }
                },

                loadDraft(showAlert = true) {
                    try {
                        const raw = localStorage.getItem('finwise_draft_v1');
                        if (!raw) return false;
                        const parsed = JSON.parse(raw) || {};
                        if (parsed.form && typeof parsed.form === 'object') {
                            this.form = { ...this.form, ...parsed.form };
                        }
                        if (parsed.currency) {
                            this.currency = String(parsed.currency);
                        }
                        const savedAt = parsed.saved_at ? new Date(parsed.saved_at) : null;
                        if (savedAt && !isNaN(savedAt.getTime())) {
                            const locale = this.getLocale();
                            this.draftStatusText = this.msg('draft_loaded_at', {
                                time: savedAt.toLocaleString(locale)
                            });
                        }
                        if (showAlert) {
                            showAppToast(this.msg('draft_restored'), 'success');
                        }
                        return true;
                    } catch (e) {
                        console.warn('Could not load draft:', e);
                        return false;
                    }
                },

                restoreDraft() {
                    const ok = this.loadDraft(true);
                    if (!ok) {
                        showAppToast(this.msg('draft_not_found'), 'info');
                    }
                },

                removeDraftStorage() {
                    try {
                        localStorage.removeItem('finwise_draft_v1');
                        this.draftStatusText = this.msg('draft_cleared');
                    } catch (e) {
                        console.warn('Could not clear draft storage:', e);
                    }
                },

                parseTags(input) {
                    if (!input) return [];
                    return String(input)
                        .split(',')

                clearInactivityTimers() {
                    if (this.inactivityTimer) {
                        clearTimeout(this.inactivityTimer);
                        this.inactivityTimer = null;
                    }
                    if (this.warningTimer) {
                        clearTimeout(this.warningTimer);
                        this.warningTimer = null;
                    }
                    if (this.countdownInterval) {
                        clearInterval(this.countdownInterval);
                        this.countdownInterval = null;
                    }
                    this.showSessionWarning = false;
                    this.sessionCountdownSeconds = 0;
                },

                startSessionWarning(seconds) {
                    const totalSeconds = Math.max(1, Math.floor(seconds));
                    this.showSessionWarning = true;
                    this.sessionCountdownSeconds = totalSeconds;
                    if (this.countdownInterval) {
                        clearInterval(this.countdownInterval);
                        this.countdownInterval = null;
                    }
                    this.countdownInterval = setInterval(() => {
                        if (!this.isLoggedIn) {
                            this.clearInactivityTimers();
                            return;
                        }
                        this.sessionCountdownSeconds = Math.max(0, this.sessionCountdownSeconds - 1);
                        if (this.sessionCountdownSeconds <= 0 && this.countdownInterval) {
                            clearInterval(this.countdownInterval);
                            this.countdownInterval = null;
                        }
                    }, 1000);
                },

                staySignedIn() {
                    this.resetInactivityTimer();
                },

                resolveInactivityTimeoutMs() {
                    const r = String(this.role || '').toLowerCase();
                    return this.inactivityByRole[r] || (10 * 60 * 1000);
                },

                setupInactivityWatcher() {
                    if (!this.activityHandlerBound) {
                        const onActivity = () => this.resetInactivityTimer();
                        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
                            window.addEventListener(evt, onActivity, { passive: true });
                        });
                        this.activityHandlerBound = true;
                    }
                    this.resetInactivityTimer();
                },

                resetInactivityTimer() {
                    this.clearInactivityTimers();
                    if (!this.isLoggedIn) return;
                    const timeoutMs = this.resolveInactivityTimeoutMs();
                    this.inactivityTimeoutMs = timeoutMs;
                    const mins = Math.max(1, Math.round(timeoutMs / 60000));
                    const warningMs = Math.min(this.sessionWarningMs, Math.max(5000, timeoutMs - 1000));
                    const warningDelay = timeoutMs - warningMs;
                    if (warningDelay > 0) {
                        this.warningTimer = setTimeout(() => {
                            if (!this.isLoggedIn) return;
                            this.startSessionWarning(Math.ceil(warningMs / 1000));
                        }, warningDelay);
                    }
                    this.inactivityTimer = setTimeout(() => {
                        if (!this.isLoggedIn) return;
                        showAppToast(this.msg('session_closed', { mins }), 'info');
                        this.logout();
                    }, timeoutMs);
                },

                async login() {
                    try {
                        const payload = {
                            username: String(this.loginForm.username || '').trim(),
                            password: String(this.loginForm.password || '')
                        };

                        // Gerçek bir endpoint'e bağlanacak, şimdilik demo
                        const res = await fetch('/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        
                        if (res.ok) {
                            const data = await res.json();
                            this.token = data.access_token;
                            this.username = data.username || this.loginForm.username;
                            this.role = String(data.role || 'analyst').toLowerCase();
                            localStorage.setItem('token', this.token);
                            localStorage.setItem('username', this.username);
                            localStorage.setItem('user_role', this.role);
                            this.inactivityTimeoutMs = this.resolveInactivityTimeoutMs();
                            this.isLoggedIn = true;
                            this.resetInactivityTimer();
                            showAppToast(this.msg('login_success'), 'success');
                        } else {
                            let errorText = this.msg('login_failed');
                            try {
                                const errData = await res.json();
                                if (errData && errData.error) errorText = errData.error;
                            } catch (_) {}
                            showAppToast(errorText, 'error');
                        }
                    } catch (e) {
                        console.error(e);
                        showAppToast(this.msg('server_error'), 'error');
                    }
                },

                logout() {
                    this.clearInactivityTimers();
                    this.token = '';
                    this.username = '';
                    this.role = '';
                    localStorage.removeItem('token');
                    localStorage.removeItem('username');
                    localStorage.removeItem('user_role');
                    this.isLoggedIn = false;
                    this.result = null;
                },

                    const q = this.msg('logout_confirm');
                    showConfirmDialog({

                        confirmText: this.msg('logout_confirm_yes'),
                        cancelText: this.msg('cancel_action'),

                getAutoFillBatchSummary() {
                    if (!this.autoFillBatch.length) return '';

                        acc.count += 1;
                        acc.totalDti += Number(item.form?.loan_percent_income || 0);
                        acc[p] = (acc[p] || 0) + 1;
                        return acc;
                    }, { count: 0, totalDti: 0, low: 0, mid: 0, high: 0 });
                    const avgDtiPct = ((stats.totalDti / Math.max(1, stats.count)) * 100).toFixed(1);
                    return this.msg('batch_summary', {
                        count: stats.count,
                        low: stats.low,

                    });

                autoFillDemo() {
                    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
                    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
                    const randFloat = (min, max, decimals = 1) => Number((Math.random() * (max - min) + min).toFixed(decimals));
                    const pickWeighted = (items) => {
                        const total = items.reduce((s, x) => s + x.weight, 0);
                        let point = Math.random() * total;
                        for (const item of items) {
                            point -= item.weight;
                            if (point <= 0) return item.value;
                        }
                        return items[items.length - 1].value;
                    };

                    const profile = this.autoFillMode === 'random'
                        ? pickWeighted([
                            { value: 'low', weight: 35 },
                            { value: 'mid', weight: 45 },
                            { value: 'high', weight: 20 }
                        ])
                        : this.autoFillMode;

                    const cfg = this.getProfileConfigs()[profile];

                    let generatedForm = null;
                    let signature = '';
                    let isUnique = false;
                    for (let i = 0; i < 12; i++) {
                        const person_income = randInt(cfg.income[0], cfg.income[1]);
                        const person_age = randInt(cfg.age[0], cfg.age[1]);
                        const person_emp_length = randInt(cfg.empYears[0], Math.min(cfg.empYears[1], Math.max(0, person_age - 18)));
                        const amountPct = randFloat(cfg.amountPct[0], cfg.amountPct[1], 3);
                        const loan_amnt = Math.max(3000, Math.min(120000, Math.round(person_income * amountPct)));
                        const loan_int_rate = randFloat(cfg.interest[0], cfg.interest[1], 1);
                        const cb_person_cred_hist_length = randInt(cfg.creditHistMin, Math.max(cfg.creditHistMin, person_age - 18));

                        generatedForm = {
                            customer_id: 'CUST-' + Math.floor(1000 + Math.random() * 900000),
                            person_age,
                            person_income,
                            person_emp_length,
                            loan_amnt,
                            loan_int_rate,
                            loan_percent_income: Number((loan_amnt / person_income).toFixed(3)),
                            cb_person_cred_hist_length,
                            person_home_ownership: pick(cfg.ownership),
                            loan_intent: pick(cfg.intent),
                            loan_grade: pick(cfg.grade),
                            cb_person_default_on_file: pick(cfg.default)
                        };

                        signature = [
                            generatedForm.person_age,
                            generatedForm.person_income,
                            generatedForm.person_emp_length,
                            generatedForm.loan_amnt,
                            generatedForm.loan_int_rate,
                            generatedForm.loan_percent_income,
                            generatedForm.cb_person_cred_hist_length,
                            generatedForm.person_home_ownership,
                            generatedForm.loan_intent,
                            generatedForm.loan_grade,
                            generatedForm.cb_person_default_on_file
                        ].join('|');

                        if (signature !== this.lastAutoFillSignature && !this.recentAutoFillSignatures.includes(signature)) {
                            isUnique = true;
                            break;
                        }
                    }

                    if (!isUnique && generatedForm) {
                        generatedForm.customer_id = 'CUST-' + Math.floor(1000000 + Math.random() * 9000000);
                        generatedForm.loan_int_rate = Number(Math.min(35, generatedForm.loan_int_rate + 0.1).toFixed(1));
                        signature = [
                            generatedForm.person_age,
                            generatedForm.person_income,
                            generatedForm.person_emp_length,
                            generatedForm.loan_amnt,
                            generatedForm.loan_int_rate,
                            generatedForm.loan_percent_income,
                            generatedForm.cb_person_cred_hist_length,
                            generatedForm.person_home_ownership,
                            generatedForm.loan_intent,
                            generatedForm.loan_grade,
                            generatedForm.cb_person_default_on_file
                        ].join('|');
                    }

                    this.form = generatedForm;
                    this.lastAutoFillSignature = signature;
                    this.recentAutoFillSignatures.push(signature);
                    this.lastAutoFillProfile = profile;
                    if (this.recentAutoFillSignatures.length > 10) {
                        this.recentAutoFillSignatures = this.recentAutoFillSignatures.slice(-10);
                    }
                },

                generateAutoFillBatch() {
                    const generated = [];
                    const seen = new Set();
                    for (let i = 0; i < 5; i++) {
                        this.autoFillDemo();
                        if (!this.lastAutoFillSignature || seen.has(this.lastAutoFillSignature)) continue;
                        seen.add(this.lastAutoFillSignature);
                        generated.push({
                            id: `${Date.now()}-${i}`,
                            profile: this.lastAutoFillProfile,
                            form: { ...this.form },
                        });
                    }
                    this.autoFillBatch = generated.sort((a, b) => (a.form.loan_percent_income || 0) - (b.form.loan_percent_income || 0));
                    this.saveAutoFillBatch();
                    this.draftStatusText = this.msg('batch_generated', { count: generated.length });
                },

                applyGeneratedScenario(idx) {
                    const item = this.autoFillBatch[idx];
                    if (!item) return;
                    this.form = { ...item.form };
                    this.lastAutoFillProfile = item.profile;
                    this.draftStatusText = this.msg('scenario_applied', { index: idx + 1 });
                },

                applyBestScenario() {
                    if (!this.autoFillBatch.length) return;
                    this.applyGeneratedScenario(0);
                },

                applyWorstScenario() {
                    if (!this.autoFillBatch.length) return;
                    this.applyGeneratedScenario(this.autoFillBatch.length - 1);
                },

                clearAutoFillBatch() {
                    this.autoFillBatch = [];
                    this.saveAutoFillBatch();
                    this.draftStatusText = this.msg('scenario_list_cleared');

                async openApplicationHistory() {

                    const filterStorageKey = 'finwise_history_filters_v1';

                    const normalizeSelected = () => {
                        const currentIds = new Set(items.map(it => Number(it.id)));
                        selectedIds = new Set([...selectedIds].filter(id => currentIds.has(Number(id))));
                    };

                    const loadHistoryFilters = () => {
                        try {
                            const raw = localStorage.getItem(filterStorageKey);
                            if (!raw) return;
                            const f = JSON.parse(raw) || {};
                            historySearch = String(f.historySearch || '');
                            decisionFilter = String(f.decisionFilter || 'ALL');
                            dateFrom = String(f.dateFrom || '');
                            dateTo = String(f.dateTo || '');
                            activeTag = String(f.activeTag || 'ALL');
                            sortMode = String(f.sortMode || 'date_desc');
                            currentPage = Math.max(1, Number(f.currentPage || 1));
                            pageSize = Math.max(3, Math.min(25, Number(f.pageSize || 6)));
                        } catch (e) {
                            // ignore invalid local filter state
                        }

                    const saveHistoryFilters = () => {

                                sortMode,
                                currentPage,
                                pageSize,

                        } catch (e) {
                            // ignore storage quota issues
                        }

                    const getTagPool = () => {
                        const set = new Set();
                        items.forEach(it => {
                            const meta = this.historyMeta[String(it.id)] || {};
                            const tags = Array.isArray(meta.tags) ? meta.tags : [];
                            tags.forEach(t => {
                                const v = String(t || '').trim();
                                if (v) set.add(v);
                            });
                        });
                        return Array.from(set).sort((a, b) => a.localeCompare(b));
                    };

                    const matchDecision = (it) => {
                        if (decisionFilter === 'ALL') return true;
                        const d = String(it?.decision || '').toUpperCase();
                        if (decisionFilter === 'APPROVED') return d.includes('ONAY') || d.includes('APPROV');
                        if (decisionFilter === 'REJECTED') return d.includes('RED') || d.includes('REJECT');
                        return true;
                    };

                    const matchDateRange = (it) => {
                        if (!dateFrom && !dateTo) return true;
                        const dt = new Date(it?.created_at || '');
                        if (isNaN(dt.getTime())) return false;
                        if (dateFrom) {
                            const from = new Date(`${dateFrom}T00:00:00`);
                            if (dt < from) return false;
                        }
                        if (dateTo) {
                            const to = new Date(`${dateTo}T23:59:59`);
                            if (dt > to) return false;
                        }
                        return true;
                    };

                    const matchTag = (it) => {
                        if (activeTag === 'ALL') return true;
                        const meta = this.historyMeta[String(it.id)] || {};
                        const tags = Array.isArray(meta.tags) ? meta.tags.map(v => String(v || '').trim()) : [];
                        return tags.includes(activeTag);
                    };

                    const getFiltered = () => {
                        const q = String(historySearch || '').trim().toLowerCase();
                        const filtered = items.filter(it => {
                            if (!matchDecision(it)) return false;
                            if (!matchDateRange(it)) return false;
                            if (!matchTag(it)) return false;
                            if (!q) return true;
                            const meta = this.historyMeta[String(it.id)] || {};
                            const searchable = [
                                it.id,
                                it.customer_id,
                                it.applicant_name,
                                it.decision,
                                it.loan_amnt,
                                meta.note,
                                Array.isArray(meta.tags) ? meta.tags.join(' ') : ''
                            ].map(v => String(v || '').toLowerCase()).join(' ');
                            return searchable.includes(q);
                        });

                        if (sortMode === 'date_asc') {
                            filtered.sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
                        } else if (sortMode === 'loan_desc') {
                            filtered.sort((a, b) => Number(b.loan_amnt || 0) - Number(a.loan_amnt || 0));
                        } else if (sortMode === 'loan_asc') {
                            filtered.sort((a, b) => Number(a.loan_amnt || 0) - Number(b.loan_amnt || 0));
                        } else {

                        }

                        return filtered;

                                </div>
                                <div style="padding:8px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;">

                                    <option value="loan_desc" ${sortMode === 'loan_desc' ? 'selected' : ''}>${this.lang === 'tr' ? 'Kredi (Yüksek-Düşük)' : 'Loan (High-Low)'}</option>
                                    <option value="loan_asc" ${sortMode === 'loan_asc' ? 'selected' : ''}>${this.lang === 'tr' ? 'Kredi (Düşük-Yüksek)' : 'Loan (Low-High)'}</option>
