    <!-- ===== RESTORED FUNCTIONS ===== -->
    <script>
        function getToken()    { return localStorage.getItem('token') || ''; }
        function getUserRole() { return String(localStorage.getItem('user_role') || '').toLowerCase(); }
        function setUserRole(r){ localStorage.setItem('user_role', String(r||'').toLowerCase()); }
        function clearUserRole(){ localStorage.removeItem('user_role'); }

        function escapeHtml(v) {
            return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function _uiLang() { try { return localStorage.getItem('finwise_lang')||'tr'; } catch(e){ return 'tr'; } }
        function _tr(tr, en) { return _uiLang()==='en' ? en : tr; }

        function normalizeDecisionLabel(decision, lang = _uiLang()) {
            const d = String(decision || '').toUpperCase();
            const isApproved = d.includes('ONAY') || d.includes('APPROV');
            const isRejected = d.includes('RED') || d.includes('REJECT');
            if (isApproved) return lang === 'tr' ? 'ONAYLANDI' : 'APPROVED';
            if (isRejected) return lang === 'tr' ? 'REDDEDILDI' : 'REJECTED';
            return String(decision || '-');
        }

        function setupPopupOverlay(overlay, panelSelector, closeSelector) {
            if (!overlay) return () => {};
            const previousOverflow = document.body.style.overflow;
            const previousActiveElement = document.activeElement;
            document.body.style.overflow = 'hidden';
            overlay.dataset.finwisePopup = '1';

            const panel = panelSelector ? overlay.querySelector(panelSelector) : null;
            if (panel) {
                panel.setAttribute('role', 'dialog');
                panel.setAttribute('aria-modal', 'true');
                if (!panel.hasAttribute('tabindex')) {
                    panel.setAttribute('tabindex', '-1');
                }
                panel.style.transition = 'opacity .18s ease, transform .18s ease';
                panel.style.opacity = '0';
                panel.style.transform = 'translateY(8px) scale(0.985)';
                requestAnimationFrame(() => {
                    panel.style.opacity = '1';
                    panel.style.transform = 'translateY(0) scale(1)';
                    try {
                        const firstFocusable = panel.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                        (firstFocusable || panel).focus();
                    } catch (e) {
                        // ignore focus errors
                    }
                });
            }

            const cleanup = () => {
                document.removeEventListener('keydown', onEsc);
                if (!document.querySelector('[data-finwise-popup="1"]')) {
                    document.body.style.overflow = previousOverflow;
                }
                if (previousActiveElement && typeof previousActiveElement.focus === 'function') {
                    try { previousActiveElement.focus(); } catch (e) {}
                }
            };

            const close = () => {
                if (!overlay.isConnected || overlay.dataset.closing === '1') return;
                overlay.dataset.closing = '1';
                if (panel) {
                    panel.style.opacity = '0';
                    panel.style.transform = 'translateY(8px) scale(0.985)';
                }
                setTimeout(() => {
                    if (overlay.isConnected) overlay.remove();
                    cleanup();
                }, 170);
            };

            const onEsc = (e) => {
                if (e.key === 'Escape') {
                    close();
                    return;
                }
                if (e.key === 'Tab' && panel) {
                    const focusables = [...panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
                        .filter(el => !el.hasAttribute('disabled') && !el.getAttribute('aria-hidden'));
                    if (!focusables.length) {
                        e.preventDefault();
                        panel.focus();
                        return;
                    }
                    const first = focusables[0];
                    const last = focusables[focusables.length - 1];
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            };

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) close();
            });
            const closeBtn = closeSelector ? overlay.querySelector(closeSelector) : null;
            if (closeBtn) closeBtn.onclick = close;
            document.addEventListener('keydown', onEsc);
            return close;
        }

        function showAppToast(message, variant = 'success') {
            if (!message) return;
            let host = document.getElementById('finwiseToastHost');
            if (!host) {
                host = document.createElement('div');
                host.id = 'finwiseToastHost';
                host.style.cssText = 'position:fixed;top:18px;right:18px;z-index:12000;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:360px;';
                document.body.appendChild(host);
            }

            const palette = variant === 'error'
                ? { bg: '#fff1f2', border: '#fecdd3', text: '#9f1239' }
                : variant === 'info'
                    ? { bg: '#eff6ff', border: '#bfdbfe', text: '#1d4ed8' }
                    : { bg: '#ecfdf5', border: '#bbf7d0', text: '#166534' };

            const toast = document.createElement('div');
            toast.style.cssText = `pointer-events:auto;padding:12px 14px;border-radius:14px;border:1px solid ${palette.border};background:${palette.bg};color:${palette.text};box-shadow:0 14px 30px rgba(15,23,42,.12);font-size:13px;font-weight:700;opacity:0;transform:translateY(-6px);transition:opacity .18s ease, transform .18s ease;`;
            toast.textContent = String(message);
            host.appendChild(toast);

            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
            });

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-6px)';
                setTimeout(() => toast.remove(), 180);
            }, 2600);
        }

        function showConfirmDialog({ message, confirmText, cancelText, variant = 'danger' }) {
            return new Promise((resolve) => {
                const palette = variant === 'danger'
                    ? { bg: '#fee2e2', border: '#fecaca', text: '#991b1b', btn: '#b91c1c' }
                    : { bg: '#dbeafe', border: '#bfdbfe', text: '#1e3a8a', btn: '#1d4ed8' };

                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;inset:0;background:linear-gradient(180deg, rgba(15,23,42,0.58), rgba(15,23,42,0.68));backdrop-filter:blur(4px);z-index:13000;display:flex;align-items:center;justify-content:center;padding:16px;';
                overlay.innerHTML = `
                    <div id="_confirmPanel" style="background:#fff;border-radius:20px;padding:20px;max-width:420px;width:100%;box-shadow:0 24px 80px rgba(15,23,42,.30);border:1px solid ${palette.border};">
                        <div style="padding:10px 12px;border-radius:12px;background:${palette.bg};color:${palette.text};font-size:0.9em;font-weight:700;line-height:1.5;">${escapeHtml(String(message || 'Are you sure?'))}</div>
                        <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;">
                            <button id="_confirmCancel" style="padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#334155;font-size:0.84em;font-weight:700;cursor:pointer;">${escapeHtml(String(cancelText || 'Cancel'))}</button>
                            <button id="_confirmOk" style="padding:9px 12px;border:none;border-radius:10px;background:${palette.btn};color:#fff;font-size:0.84em;font-weight:800;cursor:pointer;">${escapeHtml(String(confirmText || 'Confirm'))}</button>
                        </div>
                    </div>`;

                document.body.appendChild(overlay);
                const close = setupPopupOverlay(overlay, '#_confirmPanel', '#_confirmCancel');
                const okBtn = overlay.querySelector('#_confirmOk');
                const finish = (result) => {
                    close();
                    resolve(Boolean(result));
                };

                if (okBtn) {
                    okBtn.addEventListener('click', () => finish(true));
                }

                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) finish(false);
                });
            });
        }

        document.addEventListener('alpine:initialized', () => {
            const el = document.querySelector('[x-data]');
            if (!el) return;
            Alpine.effect(() => {
                try { const l = Alpine.$data(el).lang; if (l) localStorage.setItem('finwise_lang', l); } catch(e){}
            });
        });

        // ---------- Improvement Suggestions ----------
        async function loadImprovementSuggestions(applicationId, isApproved) {
            const container = document.getElementById('improvementSuggestionsContainer');
            const token = getToken();
            if (!container) return;
            if (isApproved || !applicationId || !token) {
                container.style.display = 'none'; container.innerHTML = ''; return;
            }
            container.style.display = 'block';
            container.innerHTML = `<div class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700">${_tr('Iyilestirme senaryolari hesaplaniyor...','Calculating improvement scenarios...')}</div>`;
            try {
                const res = await fetch('http://127.0.0.1:5000/api/v2/simulate/improvement-options', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ base_application_id: Number(applicationId) })
                });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload?.error || _tr('Hata', 'Error'));
                const suggestions = Array.isArray(payload?.suggestions) ? payload.suggestions : [];
                if (!suggestions.length) {
                    container.innerHTML = `<div class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">${_tr('Anlamli iyilestirme onerisi bulunamadi.','No meaningful improvement suggestion found.')}</div>`;
                    return;
                }
                const cards = suggestions.map(item => {
                    const delta = Number(item?.approval_probability_delta || 0);
                    const simApproval = Number(item?.simulated?.onay_olasiligi || 0);
                    const badges = Object.entries(item?.overrides || {})
                        .map(([k,v]) => `<span class="inline-block mr-1.5 mt-1 rounded-full bg-slate-200 px-2 py-0.5 text-[11px] text-slate-700">${escapeHtml(k)}: ${escapeHtml(String(v))}</span>`)
                        .join('');
                    return `<div class="rounded-lg border border-blue-100 bg-white p-3">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <div class="text-sm font-bold text-blue-900">${escapeHtml(String(item?.title || _tr('Senaryo', 'Scenario')))}</div>
                                <div class="mt-0.5 text-xs text-slate-600">${escapeHtml(String(item?.description||''))}</div>
                            </div>
                            <div class="min-w-[118px] text-right text-xs">
                                <div class="text-slate-500">${_tr('Olasilik artisi','Prob. gain')}</div>
                                <div class="font-extrabold ${delta > 0 ? 'text-green-700' : 'text-rose-700'}">${delta>=0?'+':''}${delta.toFixed(3)}</div>
                                <div class="text-slate-700">${_tr('Onay','Approval')}: ${simApproval.toFixed(3)}</div>
                            </div>
                        </div>
                        <div class="mt-2">${badges}</div>
                        <div class="mt-2.5 text-right">
                            <button onclick="openApprovalSimulatorWithOverrides(this)"
                                    data-overrides="${escapeHtml(JSON.stringify(item?.overrides||{}))}"
                                    class="rounded-md bg-sky-500 px-3 py-1.5 text-xs font-bold text-white transition hover:bg-sky-600">
                                ${_tr('Bu Senaryoyu Simulate Et','Simulate This Scenario')}
                            </button>
                        </div>
                    </div>`;
                }).join('');
                container.innerHTML = `
                    <div class="rounded-xl border border-blue-200 bg-gradient-to-b from-blue-50 to-white p-4 shadow-sm">
                        <h4 class="text-sm font-bold text-blue-700">${_tr('Onay Artirma Onerileri','Approval Improvement Suggestions')}</h4>
                        <p class="mt-1 text-xs text-slate-600">${_tr('Onerilen aksiyonlar simule edildi.','Recommended actions were simulated.')}</p>
                        <div class="mt-3 grid gap-2.5">${cards}</div>
                    </div>`;
            } catch(err) {
                container.innerHTML = `<div class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">${escapeHtml(String(err.message || _tr('Iyilestirme onerileri yuklenemedi.', 'Could not load improvement suggestions.')))}</div>`;
            }
        }

        // ---------- Simulator ----------
        function openApprovalSimulatorWithOverrides(btn) {
            try { openApprovalSimulator(JSON.parse(btn.dataset.overrides||'{}')); }
            catch(e) { openApprovalSimulator(); }
        }

        async function openApprovalSimulator(prefillOverrides = {}) {
            const token = getToken();
            if (!token) { showAppToast(_tr('Lutfen once giris yapin.','Please log in first.'), 'error'); return; }
            const income = Number(prefillOverrides.person_income ?? 60000);
            const loan   = Number(prefillOverrides.loan_amnt   ?? 20000);
            const rate   = Number(prefillOverrides.loan_int_rate ?? 14);
            const lpi    = Number(prefillOverrides.loan_percent_income ?? 0.3);
            const grade  = String(prefillOverrides.loan_grade ?? 'C');

            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:linear-gradient(180deg, rgba(15,23,42,0.58), rgba(15,23,42,0.68));backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
            overlay.innerHTML = `
                <div id="_simPanel" style="background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);border-radius:24px;padding:28px;max-width:620px;width:100%;box-shadow:0 24px 80px rgba(15,23,42,.30);overflow-y:auto;max-height:90vh;border:1px solid rgba(191,219,254,.9);">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:16px;">
                        <div>
                            <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:0.72em;font-weight:800;letter-spacing:.02em;text-transform:uppercase;">${_tr('Karar Laboratuvari','Decision Lab')}</div>
                            <h2 style="margin:10px 0 4px 0;font-size:1.18em;font-weight:800;color:#0f172a;">${_tr('Senaryo Simulatoru','Scenario Simulator')}</h2>
                            <p style="margin:0;color:#64748b;font-size:0.88em;line-height:1.5;">${_tr('Gelir, tutar, faiz ve oran degisikliklerinin onay olasiligini nasil etkiledigini hizlica test edin.','Test how income, amount, rate, and ratio changes affect approval probability.')}</p>
                        </div>
                        <button id="_simClose" style="border:none;background:none;cursor:pointer;font-size:1.5em;color:#64748b;line-height:1;">&times;</button>
                    </div>
                    <div style="padding:16px;border:1px solid #dbeafe;border-radius:18px;background:rgba(255,255,255,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                            <input id="simIncome" type="number" step="100"  value="${income}" placeholder="${_tr('Yillik Gelir','Annual Income')}" style="padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;">
                            <input id="simLoan"   type="number" step="100"  value="${loan}"   placeholder="${_tr('Kredi Tutari','Loan Amount')}"   style="padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;">
                            <input id="simRate"   type="number" step="0.1"  value="${rate}"   placeholder="${_tr('Faiz (%)','Rate (%)') }"          style="padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;">
                            <input id="simLpi"    type="number" step="0.01" min="0" max="1" value="${lpi}" placeholder="${_tr('Kredi/Gelir (0-1)','Loan/Income (0-1)')}" style="padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;">
                            <input id="simGrade"  type="text"   maxlength="1" value="${escapeHtml(grade)}" placeholder="Grade" style="padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;text-transform:uppercase;background:#fff;grid-column:1 / span 2;">
                        </div>
                    </div>
                    <div style="display:flex;justify-content:flex-end;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap;">
                        <label style="display:flex;align-items:center;gap:6px;margin-right:auto;font-size:0.8em;color:#475569;cursor:pointer;">
                            <input id="simOnlyLatest" type="checkbox" />
                            <span>${_tr('Yalnizca son sonucu goster','Show only latest result')}</span>
                        </label>
                        <button id="simRunBtn" style="padding:11px 22px;border:none;border-radius:12px;background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 12px 24px rgba(14,165,233,.24);">${_tr('Simulasyonu Calistir','Run Simulation')}</button>
                    </div>
                    <div id="simResult" style="margin-top:12px;"></div>
                    <div id="simChartWrap" style="margin-top:12px;display:none;"><canvas id="simDeltaChart" height="110"></canvas></div>
                    <div id="simCompareWrap" style="margin-top:12px;display:none;"></div>
                </div>`;
            document.body.appendChild(overlay);
            setupPopupOverlay(overlay, '#_simPanel', '#_simClose');

            let simChart = null;
            const runHistory = [];
            const maxRunHistory = 6;
            const simHistoryKey = `finwise_sim_history_v1_${window._lastApplicationId || 'draft'}`;
            const simCompareCollapsedKey = `finwise_sim_compare_collapsed_v1_${window._lastApplicationId || 'draft'}`;
            let simCompareCollapsed = true;
            const simOnlyLatestKey = 'finwise_sim_only_latest_v1';
            let simOnlyLatest = true;
            try {
                const rawHistory = localStorage.getItem(simHistoryKey);
                if (rawHistory) {
                    const parsedHistory = JSON.parse(rawHistory);
                    if (Array.isArray(parsedHistory)) {
                        runHistory.push(...parsedHistory.filter(item => item && typeof item === 'object').slice(-maxRunHistory));
                    }
                }
                const collapsedRaw = localStorage.getItem(simCompareCollapsedKey);
                if (collapsedRaw !== null) {
                    simCompareCollapsed = collapsedRaw === '1';
                }
            } catch (e) {
                // ignore storage errors
            }
            try {
                const raw = localStorage.getItem(simOnlyLatestKey);
                if (raw !== null) {
                    simOnlyLatest = raw === '1';
                }
            } catch (e) {
                simOnlyLatest = true;
            }

            const onlyLatestCheckbox = overlay.querySelector('#simOnlyLatest');
            if (onlyLatestCheckbox) {
                onlyLatestCheckbox.checked = simOnlyLatest;
                onlyLatestCheckbox.addEventListener('change', () => {
                    simOnlyLatest = !!onlyLatestCheckbox.checked;
                    try {
                        localStorage.setItem(simOnlyLatestKey, simOnlyLatest ? '1' : '0');
                    } catch (e) {
                        // ignore storage errors
                    }
                    renderComparisonTable();
                });
            }

            function persistRunHistory() {
                try {
                    localStorage.setItem(simHistoryKey, JSON.stringify(runHistory.slice(-maxRunHistory)));
                } catch (e) {
                    // ignore storage errors
                }
            }

            function persistCompareCollapsed() {
                try {
                    localStorage.setItem(simCompareCollapsedKey, simCompareCollapsed ? '1' : '0');
                } catch (e) {
                    // ignore storage errors
                }
            }

            function renderComparisonTable() {
                const wrap = overlay.querySelector('#simCompareWrap');
                if (!wrap) return;
                if (simOnlyLatest) {
                    wrap.style.display = 'none';
                    wrap.innerHTML = '';
                    return;
                }
                if (!runHistory.length) {
                    wrap.style.display = 'none';
                    wrap.innerHTML = '';
                    return;
                }
                const ranked = [...runHistory].sort((a, b) => Number(b.delta || 0) - Number(a.delta || 0));
                const bestTs = ranked[0]?.ts || '';
                wrap.style.display = 'block';
                wrap.innerHTML = `
                    <div style="padding:12px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <strong style="color:#0f172a;">${_tr('Senaryo Karsilastirma','Scenario Comparison')}</strong>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span style="font-size:0.78em;color:#64748b;">${_tr('Toplam kosum','Total runs')}: ${runHistory.length}/${maxRunHistory}</span>
                                <button id="_simToggleHistory" style="padding:4px 8px;border:none;border-radius:8px;background:#dbeafe;color:#1e3a8a;font-size:0.72em;font-weight:700;cursor:pointer;">${simCompareCollapsed ? _tr('Goster','Show') : _tr('Gizle','Hide')}</button>
                                <button id="_simClearHistory" style="padding:4px 8px;border:none;border-radius:8px;background:#fee2e2;color:#991b1b;font-size:0.72em;font-weight:700;cursor:pointer;">${_tr('Temizle','Clear')}</button>
                            </div>
                        </div>
                        <div style="overflow:auto;display:${simCompareCollapsed ? 'none' : 'block'};">
                            <table style="width:100%;border-collapse:collapse;font-size:0.78em;">
                                <thead>
                                    <tr style="background:#eef2ff;color:#1e3a8a;">
                                        <th style="padding:6px;text-align:left;">#</th>
                                        <th style="padding:6px;text-align:left;">${_tr('Karar','Decision')}</th>
                                        <th style="padding:6px;text-align:right;">${_tr('Orijinal','Original')}</th>
                                        <th style="padding:6px;text-align:right;">${_tr('Simule','Simulated')}</th>
                                        <th style="padding:6px;text-align:right;">Delta</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${ranked.map((r, i) => `
                                        <tr style="border-top:1px solid #e5e7eb;${r.ts === bestTs ? 'background:#ecfdf5;' : ''}">
                                            <td style="padding:6px;">${i + 1}</td>
                                            <td style="padding:6px;">${escapeHtml(String(r.decision || '-'))}</td>
                                            <td style="padding:6px;text-align:right;">${Number(r.baseP || 0).toFixed(3)}</td>
                                            <td style="padding:6px;text-align:right;">${Number(r.simP || 0).toFixed(3)}</td>
                                            <td style="padding:6px;text-align:right;color:${Number(r.delta || 0) >= 0 ? '#15803d' : '#9f1239'};font-weight:700;">${Number(r.delta || 0) >= 0 ? '+' : ''}${Number(r.delta || 0).toFixed(3)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;

                const toggleBtn = wrap.querySelector('#_simToggleHistory');
                if (toggleBtn) {
                    toggleBtn.addEventListener('click', () => {
                        simCompareCollapsed = !simCompareCollapsed;
                        persistCompareCollapsed();
                        renderComparisonTable();
                    });
                }

                const clearBtn = wrap.querySelector('#_simClearHistory');
                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                        runHistory.length = 0;
                        persistRunHistory();
                        renderComparisonTable();
                        showAppToast(_tr('Simulasyon gecmisi temizlendi.','Simulation history cleared.'), 'info');
                    });
                }
            }

            renderComparisonTable();

            overlay.querySelector('#simRunBtn').addEventListener('click', async () => {
                const runBtn    = overlay.querySelector('#simRunBtn');
                const resultBox = overlay.querySelector('#simResult');
                const chartWrap = overlay.querySelector('#simChartWrap');
                const canvas    = overlay.querySelector('#simDeltaChart');
                const body = {
                    overrides: {
                        person_income:       Number(overlay.querySelector('#simIncome').value||60000),
                        loan_amnt:           Number(overlay.querySelector('#simLoan').value  ||20000),
                        loan_int_rate:       Number(overlay.querySelector('#simRate').value  ||14),
                        loan_percent_income: Number(overlay.querySelector('#simLpi').value   ||0.3),
                        loan_grade:          String(overlay.querySelector('#simGrade').value ||'C').toUpperCase()
                    }
                };
                if (window._lastApplicationId) body.base_application_id = Number(window._lastApplicationId);
                try {
                    runBtn.disabled = true;
                    runBtn.textContent = _tr('Calisiyor...','Running...');
                    resultBox.innerHTML = `<div style="padding:10px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px;">${_tr('Simulasyon calisiyor...','Simulation running...')}</div>`;
                    const res = await fetch('http://127.0.0.1:5000/api/v2/simulate/approval', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const p = await res.json();
                    if (!res.ok) throw new Error(p?.error||_tr('Hata','Error'));
                    const delta  = p?.approval_probability_delta;
                    const sim    = p?.simulated||{};
                    const simP   = Number(sim.onay_olasiligi||0);
                    const baseP  = Number(p?.original?.onay_olasiligi ?? (delta==null ? NaN : simP - Number(delta)));
                    runHistory.push({
                        ts: new Date().toISOString(),
                        decision: normalizeDecisionLabel(String(sim.tahmin || '-')),
                        baseP: Number.isFinite(baseP) ? baseP : 0,
                        simP,
                        delta: Number(delta || 0),
                    });
                    if (runHistory.length > maxRunHistory) {
                        runHistory.splice(0, runHistory.length - maxRunHistory);
                    }
                    persistRunHistory();
                    resultBox.innerHTML = `
                        <div style="padding:14px;border:1px solid #bfdbfe;background:linear-gradient(135deg,#eff6ff,#f8fafc);border-radius:16px;box-shadow:0 10px 24px rgba(14,165,233,.08);">
                            <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">
                                <div>
                                    <div style="font-size:0.76em;color:#64748b;text-transform:uppercase;font-weight:800;letter-spacing:.04em;">${_tr('Sonuc','Result')}</div>
                                    <div style="margin-top:4px;font-size:1.05em;font-weight:800;color:#0f172a;">${escapeHtml(normalizeDecisionLabel(String(sim.tahmin||'-')))}</div>
                                </div>
                                <div style="padding:6px 10px;border-radius:999px;background:${Number(delta || 0) >= 0 ? '#dcfce7' : '#fee2e2'};color:${Number(delta || 0) >= 0 ? '#166534' : '#991b1b'};font-size:0.8em;font-weight:800;">${_tr('Delta','Delta')}: ${delta==null?'-':Number(delta).toFixed(4)}</div>
                            </div>
                            <div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;margin-top:12px;">
                                <div style="padding:10px;border-radius:12px;background:#fff;border:1px solid #dbeafe;">
                                    <div style="font-size:0.74em;color:#64748b;">${_tr('Onay Olasiligi','Approval Prob.')}</div>
                                    <div style="margin-top:4px;font-size:1.05em;font-weight:800;color:#0369a1;">${simP.toFixed(4)}</div>
                                </div>
                                <div style="padding:10px;border-radius:12px;background:#fff;border:1px solid #dbeafe;">
                                    <div style="font-size:0.74em;color:#64748b;">${_tr('Orijinal Deger','Original Value')}</div>
                                    <div style="margin-top:4px;font-size:1.05em;font-weight:800;color:#334155;">${Number.isFinite(baseP) ? baseP.toFixed(4) : '-'}</div>
                                </div>
                            </div>
                        </div>`;
                    if (chartWrap && canvas) {
                        chartWrap.style.display = 'block';
                        if (simChart) simChart.destroy();
                        const lbls = Number.isFinite(baseP)
                            ? [_tr('Orijinal','Original'), _tr('Simule','Simulated')]
                            : [_tr('Simule','Simulated')];
                        const vals = Number.isFinite(baseP)?[baseP,simP]:[simP];
                        const clrs = Number.isFinite(baseP)?['#94a3b8','#0ea5e9']:['#0ea5e9'];
                        simChart = new Chart(canvas, {
                            type: 'bar',
                            data: { labels:lbls, datasets:[{ data:vals, backgroundColor:clrs, borderRadius:8 }] },
                            options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{min:0,max:1,ticks:{callback:v=>(v*100).toFixed(0)+'%'}}} }
                        });
                        // Auto-scroll modal to chart
                        setTimeout(() => {
                            const panel = overlay.querySelector('#_simPanel');
                            if (panel) panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' });
                            try { canvas.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch(e) {}
                        }, 100);
                    }
                    renderComparisonTable();
                    showAppToast(_tr('Simulasyon sonucu guncellendi.','Simulation result updated.'), 'success');
                } catch(err) {
                    resultBox.innerHTML = `<div style="padding:10px;border:1px solid #fecaca;background:#fff1f2;color:#9f1239;border-radius:10px;">${escapeHtml(String(err.message||_tr('Hata','Error')))}</div>`;
                } finally {
                    runBtn.disabled = false;
                    runBtn.textContent = _tr('Simulasyonu Calistir','Run Simulation');
                }
            });
        }

        // ---------- Fraud Stats (Admin) ----------
        async function showFraudStatsPanel() {
            const token = getToken();
            if (!token) { showAppToast(_tr('Lutfen once giris yapin.','Please log in first.'), 'error'); return; }
            if (getUserRole() !== 'admin') { showAppToast(_tr('Bu ozellik sadece admin kullanicilar icindir.','This feature is for admin users only.'), 'error'); return; }
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:linear-gradient(180deg, rgba(15,23,42,0.58), rgba(15,23,42,0.68));backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
            overlay.innerHTML = `
                <div id="_fraudPanel" style="background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);border-radius:22px;padding:24px;max-width:680px;width:100%;box-shadow:0 24px 80px rgba(15,23,42,.30);max-height:80vh;overflow-y:auto;border:1px solid rgba(191,219,254,.9);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <div>
                            <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:0.72em;font-weight:800;letter-spacing:.02em;text-transform:uppercase;">${_tr('Risk Izleme','Risk Monitor')}</div>
                            <h2 style="margin:8px 0 0 0;font-size:1.1em;font-weight:800;color:#1e293b;">${_tr('Fraud Izleme Durumu','Fraud Monitoring Status')}</h2>
                        </div>
                        <button id="_fraudClose" style="border:none;background:none;cursor:pointer;font-size:1.5em;color:#64748b;line-height:1;">&times;</button>
                    </div>
                    <div id="fraudStatsBody" style="padding:12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px;color:#1e3a8a;">${_tr('Fraud verileri yukleniyor...','Loading fraud metrics...')}</div>
                </div>`;
            document.body.appendChild(overlay);
            setupPopupOverlay(overlay, '#_fraudPanel', '#_fraudClose');
            try {
                const res = await fetch('http://127.0.0.1:5000/api/v2/offers/fraud-stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data?.error||_tr('Hata','Error'));
                const bodyEl = overlay.querySelector('#fraudStatsBody');
                const summary = data?.summary || {};
                const signals = data?.fraud_signals || [];

                // Summary table
                const summaryHtml = `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
                        <div style="padding:10px;background:#f0fdf4;border-radius:8px;text-align:center;">
                            <div style="font-size:1.4em;font-weight:800;color:#15803d;">${summary.approved ?? 0}</div>
                            <div style="font-size:0.75em;color:#166534;">${_tr('Onaylanan','Approved')}</div>
                        </div>
                        <div style="padding:10px;background:#fff1f2;border-radius:8px;text-align:center;">
                            <div style="font-size:1.4em;font-weight:800;color:#dc2626;">${summary.rejected ?? 0}</div>
                            <div style="font-size:0.75em;color:#9f1239;">${_tr('Reddedilen','Rejected')}</div>
                        </div>
                        <div style="padding:10px;background:#fefce8;border-radius:8px;text-align:center;">
                            <div style="font-size:1.4em;font-weight:800;color:#d97706;">${summary.overridden ?? 0}</div>
                            <div style="font-size:0.75em;color:#92400e;">${_tr('Manuel Karar','Override')}</div>
                        </div>
                        <div style="padding:10px;background:#eff6ff;border-radius:8px;text-align:center;">
                            <div style="font-size:1.4em;font-weight:800;color:#1d4ed8;">${summary.total_applications ?? 0}</div>
                            <div style="font-size:0.75em;color:#1e40af;">${_tr('Toplam','Total')}</div>
                        </div>
                    </div>`;

                const signalsHtml = signals.length ? signals.map(s => {
                    const ratio = Number(s?.ratio ?? s?.ip_lead_burst_ratio ?? 0);
                    const clr = ratio > 0.7 ? '#dc2626' : ratio > 0.4 ? '#d97706' : '#15803d';
                    const pct = ratio > 0 ? `${(ratio*100).toFixed(1)}%` : '—';
                    return `<div style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <strong style="color:#1e293b;">${escapeHtml(String(s?.signal_type||s?.type||_tr('Sinyal','Signal')))}</strong>
                            <span style="font-weight:700;color:${clr};font-size:1.1em;">${pct}</span>
                        </div>
                        <div style="font-size:0.82em;color:#64748b;margin-top:4px;">${escapeHtml(String(s?.description||''))}</div>
                    </div>`;
                }).join('') : `<div style="color:#64748b;font-size:0.9em;">${_tr('Sinyal bulunamadi.','No signals found.')}</div>`;

                bodyEl.innerHTML = summaryHtml + signalsHtml;
            } catch(err) {
                overlay.querySelector('#fraudStatsBody').innerHTML = `<div style="color:#9f1239;">${escapeHtml(String(err.message))}</div>`;
            }
        }
    </script>
</body>
</html>
